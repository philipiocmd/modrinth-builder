<title>Modrinth Modpack Builder Pro</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b100f;
  --surface: #121a17;
  --surface-2: #18231e;
  --surface-3: #202d27;
  --line: #2a3a32;
  --text: #edf5ef;
  --muted: #9aaca1;
  --accent: #8be0a6;
  --accent-strong: #53c77c;
  --orange: #ffb86b;
  --red: #ff7777;
  --purple: #c59aff;
  --radius: 16px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  width: min(100% - 40px, 1040px);
  margin: 0 auto;
  min-height: 100vh;
  padding: 42px 0 64px;
  color: var(--text);
  background:
    radial-gradient(ellipse at 12% 0%, rgba(83,199,124,.13), transparent 36rem),
    radial-gradient(ellipse at 92% 8%, rgba(129,91,190,.10), transparent 32rem),
    var(--bg);
}
body > h1 {
  max-width: 1040px;
  margin-top: 0;
  margin-bottom: 10px;
  font-size: clamp(2rem, 4vw, 3rem);
  letter-spacing: -0.055em;
  line-height: 1.08;
}
body > h1::after {
  content: "Build, check and collect your Modrinth mods in one place.";
  display: block;
  margin-top: 13px;
  color: var(--muted);
  font-size: 1rem;
  font-weight: 450;
  letter-spacing: 0;
}
body > label {
  display: inline-block;
  margin-top: 28px;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: .86rem;
  font-weight: 650;
}
body > select { margin-right: 18px; }
select, input, button {
  font: inherit;
}
input, select {
  min-height: 44px;
  padding: 10px 13px;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  transition: border-color .18s, box-shadow .18s, background .18s;
}
input:focus, select:focus {
  border-color: var(--accent-strong);
  box-shadow: 0 0 0 3px rgba(83,199,124,.15);
}
input::placeholder { color: #73877b; }
button {
  min-height: 42px;
  padding: 10px 16px;
  color: #08130c;
  background: var(--accent);
  border: 1px solid transparent;
  border-radius: 10px;
  font-weight: 750;
  cursor: pointer;
  transition: transform .16s, background .16s, border-color .16s, box-shadow .16s;
}
button:hover {
  background: #a5edb9;
  transform: translateY(-1px);
  box-shadow: 0 7px 20px rgba(83,199,124,.14);
}
button:active { transform: translateY(0); }
hr {
  width: 100%;
  max-width: 1040px;
  margin-top: 30px;
  margin-bottom: 30px;
  border: 0;
  border-top: 1px solid rgba(154,172,161,.16);
}
h3 {
  max-width: 1040px;
  margin-top: 30px;
  margin-bottom: 14px;
  font-size: 1.15rem;
  letter-spacing: -.02em;
}
#searchBox { width: min(650px, calc(100% - 115px)); }
#searchResults, #modList, #out, #treeView {
  width: 100%;
  max-width: 1040px;
  margin-top: 14px;
}
#searchResults:empty, #out:empty, #treeView:empty { display: none; }
.mod {
  padding: 16px 18px;
  margin: 11px 0;
  background: linear-gradient(145deg, rgba(24,35,30,.98), rgba(18,26,23,.98));
  border: 1px solid var(--line);
  border-radius: 13px;
  box-shadow: 0 8px 24px rgba(0,0,0,.12);
}
#searchResults .mod {
  cursor: pointer;
  transition: border-color .18s, transform .18s, background .18s;
}
#searchResults .mod:hover {
  border-color: #568b68;
  background: var(--surface-3);
  transform: translateY(-2px);
}
#searchResults .mod b, #out .mod b { font-size: 1rem; }
#searchResults small { display: inline-block; margin-top: 6px; color: var(--muted); line-height: 1.5; }
.modRow {
  display: flex;
  gap: 10px;
  margin: 10px 0;
}
.modRow input { flex: 1; min-width: 0; }
.modRow button {
  min-width: 44px;
  color: #ffdede;
  background: rgba(255,119,119,.12);
  border-color: rgba(255,119,119,.25);
}
.modRow button:hover { background: rgba(255,119,119,.22); }
.good { border-left: 4px solid var(--accent-strong); }
.depColor { border-left: 4px solid var(--orange); background: rgba(255,184,107,.07); }
.warnColor { border-left: 4px solid var(--red); background: rgba(255,119,119,.07); }
.fallbackDepColor { border-left: 4px solid var(--purple); background: rgba(197,154,255,.08); }
.tree-good { color: var(--accent); }
.tree-dep { color: var(--orange); font-weight: 700; }
.tree-warn { color: var(--red); font-weight: 700; }
.tree-fallback-dep { color: var(--purple); font-weight: 700; }
input.warnInput {
  border-color: var(--red);
  background: rgba(255,119,119,.08);
}
.fileBox {
  width: 100%;
  max-width: 1040px;
  padding: 20px;
  margin: 12px auto;
  background: rgba(18,26,23,.72);
  border: 1px dashed #496052;
  border-radius: var(--radius);
}
.fileBox small { display: inline-block; margin-top: 10px; color: var(--muted); }
#txtInput { max-width: 100%; }
#out .mod button { margin-top: 12px; }
#out > hr { margin: 20px 0 10px; }
#treeView {
  padding: 18px;
  background: rgba(18,26,23,.72);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  line-height: 1.8;
  overflow-x: auto;
}
@media (max-width: 640px) {
  body { padding: 28px 15px 48px; }
  body > h1 { font-size: 2.15rem; }
  body > label { display: block; margin-top: 18px; }
  body > select { width: 100%; margin: 0 0 8px; }
  #searchBox { width: 100%; margin: 5px 0 8px; }
  #searchBox + button { width: 100%; }
  .modRow { align-items: stretch; }
  .modRow input { width: 100%; }
  .fileBox { padding: 15px; }
}
#promoBanner,
#promoBannerClassic {
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    position: relative;
    z-index: 99999;
    min-width: 0;
    margin: 15px 0 24px;
}
.promoRow {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 12px;
    width: calc(100% - 36px);
    max-width: 900px;
    margin: 15px auto 24px;
}
.promoRow #promoBannerClassic {
    flex: 0 0 auto;
    width: auto;
}
.promoRow #promoBanner {
    flex: 1 1 auto;
    width: auto;
    max-width: none;
}
@media (max-width: 640px) {
    .promoRow {
        flex-direction: column;
        gap: 0;
    }
    .promoRow #promoBanner,
    .promoRow #promoBannerClassic {
        width: 100%;
        margin: 6px 0;
    }
}
.brandMark { max-width: 1040px; margin: 0 auto 14px; color: var(--accent); font-size: .72rem; font-weight: 850; letter-spacing: .17em; }\n.brandDot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px rgba(139,224,166,.7); vertical-align: 1px; }\n
/* Classic version navigation */
.classic-nav {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  width: fit-content;
  margin: 0 0 24px 0;
  padding: 10px 15px;
  color: var(--text);
  background: linear-gradient(135deg, #1b2922, #121a17);
  border: 1px solid #3b5947;
  border-radius: 11px;
  box-shadow: 0 5px 18px rgba(0, 0, 0, .22);
  font-size: .88rem;
  font-weight: 750;
  line-height: 1.2;
  text-decoration: none;
  transition: color .18s ease, background .18s ease, border-color .18s ease,
              box-shadow .18s ease, transform .18s ease;
}
.classic-nav:hover {
  color: #08130c;
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 7px 22px rgba(83, 199, 124, .2);
  transform: translateY(-2px);
}
.classic-nav-icon {
  color: var(--accent);
  font-size: 1.05rem;
  transition: color .18s ease, transform .18s ease;
}
.classic-nav:hover .classic-nav-icon { color: #08130c; transform: translateX(-2px); }
.classic-nav-arrow { opacity: .7; font-size: .8rem; }
@media (max-width: 640px) {
  .classic-nav { margin-bottom: 20px; }
}

<div class="brandMark"><span class="brandDot"></span> MODRINTH TOOLKIT</div><h1>Modrinth Modpack Builder Pro</h1>

<label>Minecraft Version:</label>
<select id="mcVersion"></select>

<label>Loader:</label>
<select id="loader"></select>

<hr>

<h3>Search Mods</h3>
<input id="searchBox" placeholder="Search Modrinth...">
<button onclick="searchMods()">Search</button>
<div id="searchResults"></div>

<hr>
<hr>

<h3>📄 Import TXT</h3>
<div class="fileBox">
    <input type="file" id="txtInput" accept=".txt">
    <button onclick="loadTxtFile()">Load TXT File</button><br>
    <small>One Modrinth link per line</small>
</div>

<hr>
<h3>Mods</h3>
<div id="modList"></div>
<button onclick="addMod()">+ Add Mod</button>

<br><br>

<h3>Actions</h3>
<button onclick="scan()">Scan Mods</button>
<button onclick="downloadAll()">Download</button>
<button onclick="exportTxt()">Export Mods (.txt)</button>

<div id="out"></div>

<h3>Dependency Tree</h3>
<div id="treeView"></div>

<script>

let mods = [];
let processed = new Set();
let dependencyTree = {};

/* ---------------- VERSION ---------------- */

function versionToNum(v) {
    const m = v.match(/(\d+)\.(\d+)(?:\.(\d+))?/);
    if (!m) return 0;
    return parseInt(m[1])*1e6 + parseInt(m[2])*1e3 + parseInt(m[3]||0);
}

/* ---------------- INIT ---------------- */

async function init() {

    const [v, l] = await Promise.all([
        fetch("https://api.modrinth.com/v2/tag/game_version"),
        fetch("https://api.modrinth.com/v2/tag/loader")
    ]);

    const versions = await v.json();
    const loaders = await l.json();

    const mc = document.getElementById("mcVersion");
    const loader = document.getElementById("loader");

    loaders.forEach(x => {
        const o = document.createElement("option");
        o.value = x.name;
        o.textContent = x.name;
        loader.appendChild(o);
    });

    loader.value = "fabric";

    versions.forEach(v => {
        const o = document.createElement("option");
        o.value = v.version;
        o.textContent = v.version;
        mc.appendChild(o);
    });
}

init();

/* ---------------- ADD MOD ---------------- */

function addMod(val="", manual=false) {

    const d = document.createElement("div");
    d.className = "modRow";

    const warn = manual ? "warnInput" : "";

    d.innerHTML = `
        <input class="${warn}" value="${val}" placeholder="Modrinth URL">
        <button onclick="this.parentElement.remove()">X</button>
    `;

    document.getElementById("modList").appendChild(d);
}

addMod();

/* ---------------- SEARCH ---------------- */

async function searchMods() {

    const q = document.getElementById("searchBox").value.trim();
    if (!q) return;

    const mc = document.getElementById("mcVersion").value;
    const loader = document.getElementById("loader").value;

    const facets = encodeURIComponent(JSON.stringify([
        ["project_type:mod"],
        [`versions:${mc}`],
        [`categories:${loader}`]
    ]));

    const res = await fetch(
        `https://api.modrinth.com/v2/search?query=${encodeURIComponent(q)}&facets=${facets}`
    );

    const data = await res.json();
    renderSearch(data.hits || []);
}

function renderSearch(list) {

    const box = document.getElementById("searchResults");
    box.innerHTML = "";

    list.forEach(mod => {

        const div = document.createElement("div");
        div.className = "mod";

        div.innerHTML = `<b>${mod.title}</b><br><small>${mod.description || ""}</small>`;

        div.onclick = () => addMod(`https://modrinth.com/mod/${mod.slug}`, true);

        box.appendChild(div);
    });
}

/* ---------------- CORE ---------------- */

function getSlug(url) {
    try {
        return new URL(url).pathname.split("/").filter(Boolean).pop();
    } catch {
        return url;
    }
}

async function fetchVersions(id) {
    const r = await fetch(`https://api.modrinth.com/v2/project/${id}/version`);
    return await r.json();
}

/* ---------------- PROCESS ---------------- */

async function process(input, mc, loader, dependency=false, parent=null) {

    const id = getSlug(input);
    if (processed.has(id)) return;
    processed.add(id);

    const all = await fetchVersions(id);
    if (!all?.length) return;

    const mcNum = versionToNum(mc);

    const filtered = all.filter(v =>
        v.loaders?.includes(loader)
    );

    /* EXACT MATCH FIRST */
    const exact = filtered.find(v =>
        v.game_versions?.includes(mc)
    );

    /* FALLBACK ONLY LOWER VERSIONS */
    const fallback = filtered
        .filter(v =>
            (v.game_versions || []).some(g => versionToNum(g) < mcNum)
        )
        .sort((a, b) =>
            Math.max(...(b.game_versions||[]).map(versionToNum)) -
            Math.max(...(a.game_versions||[]).map(versionToNum))
        )[0];

    const chosen = exact || fallback || all[0];
    if (!chosen) return;

    const file = chosen.files?.find(f => f.primary) || chosen.files?.[0];
    if (!file) return;

    const node = chosen.name;

    const usedFallback = !exact;

    let type =
        dependency && usedFallback ? "fallbackDependency" :
        dependency ? "dependency" :
        usedFallback ? "warn" :
        "good";

    if (!dependencyTree[node]) {
        dependencyTree[node] = {
            children: [],
            type
        };
    }

    if (parent) {
        if (!dependencyTree[parent]) {
            dependencyTree[parent] = {
                children: [],
                type: "good"
            };
        }

        if (!dependencyTree[parent].children.includes(node)) {
            dependencyTree[parent].children.push(node);
        }
    }

    if (!mods.some(m => m.projectId === chosen.project_id)) {
        mods.push({
            projectId: chosen.project_id,
            slug: id,
            name: chosen.name,
            url: file.url,
            dependency,
            compatible: !!exact,
            fallback: usedFallback
        });
    }

    if (chosen.dependencies) {
        for (const dep of chosen.dependencies) {
            if (dep.dependency_type !== "required") continue;
            if (!dep.project_id) continue;

            await process(dep.project_id, mc, loader, true, node);
        }
    }
}

/* ---------------- SCAN ---------------- */

async function scan() {

    mods = [];
    processed.clear();
    dependencyTree = {};

    const mc = document.getElementById("mcVersion").value;
    const loader = document.getElementById("loader").value;

    const inputs = [...document.querySelectorAll(".modRow input")]
        .map(i => i.value.trim())
        .filter(Boolean);

    for (const i of inputs) {
        await process(i, mc, loader);
    }

    render();
    renderTree();
}

/* ---------------- RENDER ---------------- */

function render() {

    const out = document.getElementById("out");
    out.innerHTML = "";

    mods.forEach(m => {

        const div = document.createElement("div");

        if (m.dependency && m.fallback) {
            div.className = "mod fallbackDepColor";
        }
        else if (m.dependency) {
            div.className = "mod depColor";
        }
        else if (!m.compatible) {
            div.className = "mod warnColor";
        }
        else {
            div.className = "mod good";
        }

        div.innerHTML = `
            <b>${m.name}</b><br>
            ${m.dependency && m.fallback ? "Dependency (Fallback)" :
              m.dependency ? "Dependency" :
              m.compatible ? "Compatible" : "Fallback"}<br><br>
            <button onclick="window.open('${m.url}')">Download</button>
        `;

        out.appendChild(div);
    });

    out.innerHTML += `<hr>Total: ${mods.length}`;
}

/* ---------------- TREE ---------------- */

function renderTreeNode(name, depth=0, seen=new Set()) {

    if (seen.has(name)) return "";
    seen.add(name);

    const node = dependencyTree[name] || { children: [], type: "good" };

    let cls =
        node.type === "fallbackDependency" ? "tree-fallback-dep" :
        node.type === "dependency" ? "tree-dep" :
        node.type === "warn" ? "tree-warn" :
        "tree-good";

    let html = `
        <div class="${cls}" style="margin-left:${depth*20}px">
            ${depth ? "└─ " : "<b>"}${name}${depth ? "" : "</b>"}
        </div>
    `;

    for (const child of node.children || []) {
        html += renderTreeNode(child, depth + 1, seen);
    }

    return html;
}

function renderTree() {

    const box = document.getElementById("treeView");
    box.innerHTML = "";

    const children = new Set();

    Object.values(dependencyTree).forEach(n =>
        (n.children || []).forEach(c => children.add(c))
    );

    Object.keys(dependencyTree).forEach(root => {
        if (!children.has(root)) {
            box.innerHTML += renderTreeNode(root);
        }
    });
}

/* ---------------- DOWNLOAD ---------------- */

function downloadAll() {
    mods.forEach((m,i) =>
        setTimeout(() => window.open(m.url), i*150)
    );
}

/* ---------------- TXT IMPORT ---------------- */

function loadTxtFile() {

    const file = document.getElementById("txtInput").files[0];

    if (!file) {
        alert("Select a .txt file first");
        return;
    }

    const reader = new FileReader();

    reader.onload = e => {

        const lines = e.target.result
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(line => {

                if (!line) return false;

                if (
                    line.startsWith(
                        "#Mod links with the names"
                    )
                ) {
                    return false;
                }

                return true;
            });

        lines.forEach(line => addMod(line, true));

        alert(`Imported ${lines.length} mods`);
    };

    reader.readAsText(file);
}

/* ---------------- TXT EXPORT ---------------- */

function exportTxt() {

    if (!mods.length) {
        alert("Scan mods first.");
        return;
    }

    const links = [
        ...new Set(
            mods.map(
                m => `https://modrinth.com/mod/${m.slug}`
            )
        )
    ];

    const txt = [
        "#Mod links with the names at the end are the mods downloaded. Mod links with random letters are dependencies",
        "",
        ...links
    ].join("\n");

    const blob = new Blob(
        [txt],
        { type: "text/plain" }
    );

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);
    a.download = "modrinth-modlist.txt";

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    URL.revokeObjectURL(a.href);
}

</script>
